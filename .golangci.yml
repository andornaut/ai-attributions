version: "2"
run:
  tests: true
linters:
  enable:
    - bodyclose
    - copyloopvar
    - goconst
    - gocritic
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        - G204 # subprocess launched with variable - running git is the tool's purpose
        - G703 # path traversal - the only path removed is the one os.CreateTemp returned
        - G705 # XSS - the writer say() holds is stdout or a buffer, never an HTTP response
    govet:
      disable:
        - fieldalignment
        - shadow # `if err := f(); err != nil` inside a function with an outer err is idiomatic
      enable-all: true
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    rules:
      # Tests get a shorter leash: cleanup errors, repeated fixture literals and
      # fixture helpers that return more than one caller needs are all normal.
      - linters:
          - errcheck
          - goconst
          - gosec
          - unparam
        path: _test\.go
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofmt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/andornaut/ai-attributions)
  exclusions:
    generated: lax
