name: ai-attributions
description: Fail the run when the commits a branch adds carry AI attributions.
author: andornaut

branding:
  icon: git-commit
  color: red

inputs:
  base:
    description: >-
      The ref the branch is measured against; only the commits it adds over that
      ref are scanned. Defaults to the pull request's base branch, the commit a
      push started from, or the default branch. A push to the default branch has
      no base and reads the whole history.
    required: false
    default: ""
  version:
    description: >-
      The ai-attributions release to install. The default is the release this
      action.yml was cut with, so a workflow on @v1 moves binary and action
      together. dev is the build re-cut on every push to main.
    required: false
    default: v1.2.0
  path:
    description: The repository to scan, relative to the workspace.
    required: false
    default: "."
  identity:
    description: >-
      The identity an agent-authored commit would be re-attributed to, as
      "Name <email>". Nothing is rewritten here, so this only decides what the
      report names; it defaults to whoever pushed. Passing none turns identity
      reporting off, which lets a commit an agent authored through the scan.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install ai-attributions
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        os="$(uname -s | tr '[:upper:]' '[:lower:]')"
        if [ "$os" != linux ]; then
          echo "::error::ai-attributions publishes linux archives only, and this runner is $os"
          exit 1
        fi
        case "$(uname -m)" in
          x86_64) arch=x86_64 ;;
          aarch64 | arm64) arch=arm64 ;;
          *) echo "::error::no ai-attributions archive for $(uname -m)"; exit 1 ;;
        esac

        dir="$RUNNER_TEMP/ai-attributions"
        archive="ai-attributions_${os}_${arch}.tar.gz"
        url="https://github.com/andornaut/ai-attributions/releases/download/$INPUT_VERSION"
        mkdir -p "$dir"
        curl -fsSL -o "$dir/$archive" "$url/$archive"
        curl -fsSL -o "$dir/checksums.txt" "$url/checksums.txt"

        # dev is a moving tag, so a download that straddles a re-cut would
        # otherwise install a mixed set silently.
        (cd "$dir" && sha256sum --ignore-missing --check checksums.txt)
        tar -xzf "$dir/$archive" -C "$dir"
        echo "$dir" >>"$GITHUB_PATH"

    - name: Resolve the history to scan
      shell: bash
      env:
        INPUT_BASE: ${{ inputs.base }}
        INPUT_PATH: ${{ inputs.path }}
        PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        PR_HEAD_REF: ${{ github.head_ref }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail

        repo="$GITHUB_WORKSPACE/$INPUT_PATH"
        cd "$repo"
        echo "AI_ATTRIBUTIONS_REPO=$repo" >>"$GITHUB_ENV"

        # A shallow walk stops at the boundary the checkout fetched to, which
        # would report fewer commits than the branch adds rather than fail.
        if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
          echo "deepening a shallow checkout; fetch-depth: 0 on actions/checkout skips this"
          git fetch --quiet --no-tags --unshallow origin
        fi

        # The first source that answers wins. A push is measured against where
        # the branch stood before it; a new branch and a force push have no such
        # commit to read. The default branch answers for a branch cut from it,
        # and cannot answer for a push to the default branch itself.
        base="$INPUT_BASE"
        if [ -z "$base" ]; then
          if [ -n "$PR_BASE_REF" ]; then
            base="origin/$PR_BASE_REF"
          elif [ -n "$PUSH_BEFORE" ] &&
            [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] &&
            git rev-parse --quiet --verify "$PUSH_BEFORE^{commit}" >/dev/null; then
            base="$PUSH_BEFORE"
          elif [ -n "$DEFAULT_BRANCH" ] && [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            base="origin/$DEFAULT_BRANCH"
          fi
        fi

        # Fetched only when the checkout does not already carry it: fetch-depth:
        # 0 brings every branch, and a shallower one brings only what is pushed.
        base_sha=""
        if [ -n "$base" ]; then
          base_sha=$(git rev-parse --quiet --verify "$base^{commit}" || true)
          if [ -z "$base_sha" ]; then
            case "$base" in
              origin/*) git fetch --quiet --no-tags origin "+refs/heads/${base#origin/}:refs/remotes/$base" 2>/dev/null || true ;;
            esac
            base_sha=$(git rev-parse --quiet --verify "$base^{commit}" || true)
          fi
        fi
        # A guessed base can be wrong about a repository, so it widens. One the
        # caller named is a mistake worth stopping for: widening would scan
        # history that predates whatever they were pointing at.
        if [ -n "$base" ] && [ -z "$base_sha" ]; then
          if [ -n "$INPUT_BASE" ]; then
            echo "::error::base: $base names no commit here; check the ref, or set fetch-depth: 0 on actions/checkout"
            exit 1
          fi
          echo "::warning::$base names no commit here, so the whole history is scanned instead"
          base=""
        fi

        # The scan reads the current branch, and a pull request is checked out
        # at a merge commit with HEAD detached. Its second parent is the branch
        # itself, which is the history the pull request is asking to merge.
        branch=$(git symbolic-ref --quiet --short HEAD || true)
        if [ -z "$branch" ]; then
          head=HEAD
          # A checkout of the base repository, as pull_request_target does, has
          # no commit under that sha and is scanned where it stands.
          if [ -n "$PR_HEAD_SHA" ] && git rev-parse --quiet --verify "$PR_HEAD_SHA^{commit}" >/dev/null; then
            head="$PR_HEAD_SHA"
          fi
          branch="${PR_HEAD_REF:-ai-attributions-scan}"
          git switch --quiet --force-create "$branch" "$head"
        fi
        echo "AI_ATTRIBUTIONS_BRANCH=$branch" >>"$GITHUB_ENV"

        # Compared once the branch is attached, a pull request having been
        # checked out at a merge commit that equals no base.
        if [ -n "$base" ] && [ "$base_sha" = "$(git rev-parse "HEAD^{commit}")" ]; then
          if [ -n "$INPUT_BASE" ]; then
            echo "::error::base: $base is HEAD itself, so there is nothing to measure"
            exit 1
          fi
          echo "::warning::$base is HEAD itself, so there are no added commits to scan"
        fi
        echo "AI_ATTRIBUTIONS_BASE=$base" >>"$GITHUB_ENV"

    - name: Scan for AI attributions
      shell: bash
      env:
        INPUT_IDENTITY: ${{ inputs.identity }}
      run: |
        set -uo pipefail
        # The runner starts this shell with errexit, which would end the step
        # at the scan itself, before it can report what the scan found.
        set +e

        cd "$AI_ATTRIBUTIONS_REPO" || exit 1
        # --verbose names each commit, which is what whoever fixes them needs.
        # --current-branch keeps the step answering for the branch being built,
        # so a workflow fails on what this push added rather than on a tag or an
        # old branch the checkout happens to carry.
        set -- scan --exit-code --verbose --current-branch
        if [ -n "$AI_ATTRIBUTIONS_BASE" ]; then
          set -- "$@" --base "$AI_ATTRIBUTIONS_BASE"
        fi

        # A runner has no git identity, and a scan that cannot name one says so
        # on every run. Whoever pushed is the answer to "re-attributed to whom".
        identity="$INPUT_IDENTITY"
        if [ -z "$identity" ] && [ -n "${GITHUB_ACTOR:-}" ]; then
          identity="$GITHUB_ACTOR <${GITHUB_ACTOR_ID:+$GITHUB_ACTOR_ID+}$GITHUB_ACTOR@users.noreply.github.com>"
        fi
        if [ -n "$identity" ]; then
          set -- "$@" --identity "$identity"
        fi

        report="$RUNNER_TEMP/ai-attributions-report.txt"
        ai-attributions "$@" | tee "$report"
        status="${PIPESTATUS[0]}"
        if [ "$status" -eq 0 ]; then
          exit 0
        fi
        # 3 is a repository the scan declined to examine, a fork for instance.
        # Nothing was found because nothing was looked at, which is a notice
        # rather than a pass and rather than a failure.
        if [ "$status" -eq 3 ]; then
          echo "::notice title=AI attributions not scanned::ai-attributions examined nothing here; the job log says why"
          exit 0
        fi
        if [ "$status" -ne 1 ]; then
          echo "::error::ai-attributions could not complete the scan (exit $status)"
          exit "$status"
        fi

        if [ -n "$AI_ATTRIBUTIONS_BASE" ]; then
          fix="ai-attributions apply --current-branch --base $AI_ATTRIBUTIONS_BASE"
          rebase="git rebase --interactive $AI_ATTRIBUTIONS_BASE"
          scope="Only the commits this branch adds over $AI_ATTRIBUTIONS_BASE are rewritten, so
        nothing that is already on $AI_ATTRIBUTIONS_BASE moves."
        else
          fix="ai-attributions apply --current-branch"
          rebase="git rebase --interactive --root"
          scope="The whole history of this branch is in scope, so every commit from the earliest
        change onward gets a new hash."
        fi

        guidance=$(
          cat <<MESSAGE

        The commits listed above carry AI attributions, which this repository does not
        keep in its history. Rewrite $AI_ATTRIBUTIONS_BRANCH to remove them, then force push it.

        $scope

            go install github.com/andornaut/ai-attributions@latest
            $fix
            git push --force-with-lease

        apply needs git-filter-repo on PATH. Editing the messages instead works just as
        well: run $rebase, reword each commit named
        above to drop the trailers and footers, and reset the author on the commits an
        agent signed with git commit --amend --reset-author.
        MESSAGE
        )
        echo "$guidance"
        {
          echo '## AI attributions found'
          echo '```'
          cat "$report"
          echo "$guidance"
          echo '```'
        } >>"$GITHUB_STEP_SUMMARY"
        echo "::error title=AI attributions in the commit history::Rewrite $AI_ATTRIBUTIONS_BRANCH to remove them and force push it; the job log lists the commits and the commands"
        exit 1
