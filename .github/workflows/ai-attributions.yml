name: AI attributions

# Every branch, not just pull requests: work lands on main directly as often as
# it arrives through one. A push to main re-cuts the release this action
# installs, so a run here installs the previous one, which is the build every
# other repository is running anyway.
on:
  push:
    branches: ["**"]
  pull_request:
  # Called by the release workflow, so that nothing is published that this has
  # not passed. Workflows do not wait on each other, so a green scan beside a
  # release says nothing about whether the release waited for it.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the branch rather than the ref, so a re-push to one branch cancels
# its own earlier scan and not another branch's. Keyed by the event as well: a
# cancelled run leaves its check runs on the head commit, and GitHub counts
# those against the required checks, so a push and its pull request cancelling
# each other would block the merge.
# Keyed by the calling workflow as well, so the run started by a push and the
# run the release workflow calls do not cancel each other.
# Qualified by the repository the branch lives in, since a fork names its
# branches itself: two pull requests from different forks would otherwise share
# a group whenever they pick the same branch name.
concurrency:
  group: attributions-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ai-attributions:
    name: AI attributions
    runs-on: ubuntu-latest
    # Capped well under the six-hour default: nothing here runs longer than
    # six minutes, so a job still going at fifteen has hung rather than failed.
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # The action in this repository, installing the binary a release built.
      # What another repository gets from andornaut/ai-attributions, checked
      # here against a real pull request rather than only in tests.
      - name: Scan the branch
        uses: ./
        with:
          # The rolling build, not the release action.yml defaults to: this
          # repository is where that default gets bumped, and a bump names a
          # release that is published after the commit making it.
          version: dev
          # This repository holds itself to both, so its own history is what the
          # action asks other repositories for. Each needs a binary carrying the
          # flag behind it, and dev is re-cut from main: a branch that adds one
          # of these flags scans red until the change it makes lands.
          emdashes: true
          agents-files: true
