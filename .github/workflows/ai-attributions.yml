name: AI attributions

# Every branch, not just pull requests: work lands on main directly as often as
# it arrives through one. A push to main re-cuts the release this action
# installs, so a run here installs the previous one, which is the build every
# other repository is running anyway.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the branch rather than the ref, so the push event and the pull
# request event for one branch share a group instead of running the same scan
# twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ai-attributions:
    name: AI attributions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # The action in this repository, installing the binary a release built.
      # What another repository gets from andornaut/ai-attributions, checked
      # here against a real pull request rather than only in tests.
      - name: Scan the branch
        uses: ./
        with:
          # The rolling build, not the release action.yml defaults to: this
          # repository is where that default gets bumped, and a bump names a
          # release that is published after the commit making it.
          version: dev
