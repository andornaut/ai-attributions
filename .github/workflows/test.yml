name: Test

# Every branch, not just main and pull requests: work lands on main directly as
# often as it arrives through one, so a check that only runs on main is a check
# that runs after the fact.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  # Called by the release workflow, so that nothing is published that this has
  # not passed. Workflows do not wait on each other, so a green Test run beside
  # a release says nothing about whether the release waited for it.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the branch rather than the ref, so a re-push to one branch cancels
# its own earlier run and not another branch's. Keyed by the event as well: a
# cancelled run leaves its check runs on the head commit, and GitHub counts
# those against the required checks, so a push and its pull request cancelling
# each other would block the merge.
# Keyed by the calling workflow as well, so the run started by a push and the
# run the release workflow calls do not cancel each other.
# Qualified by the repository the branch lives in, since a fork names its
# branches itself: two pull requests from different forks would otherwise share
# a group whenever they pick the same branch name.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # Capped well under the six-hour default: nothing here runs longer than
    # six minutes, so a job still going at fifteen has hung rather than failed.
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # Nothing in this job uses the token, so it is not left
          # in .git/config for a later step to read.
          persist-credentials: false
          # The scan at the end of this job reads the commits the branch added,
          # so the whole history has to be on disk. The Go suite needs only the
          # tree, and would take the default depth of one.
          fetch-depth: 0

      - name: Set up Docker
        uses: docker/setup-docker-action@v5.7.0
        with:
          version: v29.9.3

      - name: Build
        shell: bash
        run: |
          source tests/container/stock
          stock_begin "$PWD"
          STOCK_NETWORK=bridge stock_run "golang:$(awk '$1 == "go" {print $2; exit}' go.mod)" -- sh tests/container/go build
          stock_finish

      - name: Test
        shell: bash
        run: |
          source tests/container/stock
          stock_begin "$PWD"
          output=$(mktemp -d)
          STOCK_OUTPUT_DIR="$output" STOCK_NETWORK=bridge stock_run "golang:$(awk '$1 == "go" {print $2; exit}' go.mod)" -- sh tests/container/go test
          stock_finish
          cp "$output/coverage.txt" coverage.txt

      - name: Upload coverage
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: coverage.txt

      # The action as another repository consumes it: action.yml driving a real
      # binary over the history the branch added, which the Go suite cannot
      # reach. A step in this job rather than one of its own, so the Test check
      # that already guards main covers it, with no second name for the ruleset
      # to have to carry.
      - name: Scan the branch with the action in this repository
        uses: ./
        with:
          # The rolling build, not the release action.yml defaults to: this
          # repository is where that default gets bumped, and a bump names a
          # release that is published after the commit making it. dev is re-cut
          # from every push to main, so a branch that adds a flag scans red here
          # until the change it makes lands.
          version: dev
          emdashes: true
          agents-files: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # Nothing in this job uses the token, so it is not left
          # in .git/config for a later step to read.
          persist-credentials: false

      - name: Set up Docker
        uses: docker/setup-docker-action@v5.7.0
        with:
          version: v29.9.3

      - name: Run lint gate
        shell: bash
        run: |
          source tests/container/stock
          stock_begin "$PWD"
          STOCK_NETWORK=bridge stock_run "golang:$(awk '$1 == "go" {print $2; exit}' go.mod)" -- sh tests/container/go lint
          STOCK_NETWORK=bridge stock_run golangci/golangci-lint:v2.15.0 -- sh tests/container/go-lint
          stock_run goreleaser/goreleaser:v2.20.0 -- sh tests/container/release-config
          STOCK_NETWORK=bridge stock_run node:24.22.2 -- sh tests/container/markdown
          stock_readonly koalaman/shellcheck:v0.11.0 /bin/shellcheck -x -P SCRIPTDIR tests/container/stock tests/container/check-stock tests/container/go tests/container/go-lint tests/container/release-config tests/container/markdown
          stock_finish
